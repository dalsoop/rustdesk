name: Sign APK with V2/V3 Scheme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless wget curl

      - name: Download unsigned APK from release
        run: |
          curl -L -o rustdesk-unsigned.apk "https://github.com/dalsoop/rustdesk-korean/releases/download/v1.5.0-korean-fix/rustdesk-1.5.0-aarch64.apk"
          ls -lh rustdesk-unsigned.apk

      - name: Generate Keystore and Sign APK
        run: |
          keytool -genkeypair -v -keystore release.jks -alias rustdesk \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=RustDesk, OU=Mobile, O=Dalsoop, L=Seoul, ST=Seoul, C=KR"

          BUILD_TOOL_PATH=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -n 1)
          echo "Using apksigner from: $BUILD_TOOL_PATH"

          # Align & Sign
          $BUILD_TOOL_PATH/zipalign -v -p 4 rustdesk-unsigned.apk rustdesk-aligned.apk || cp rustdesk-unsigned.apk rustdesk-aligned.apk

          $BUILD_TOOL_PATH/apksigner sign \
            --ks release.jks \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --ks-key-alias rustdesk \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out rustdesk-1.5.0-aarch64.apk \
            rustdesk-aligned.apk

          echo "=== VERIFYING SIGNATURE ==="
          $BUILD_TOOL_PATH/apksigner verify --verbose rustdesk-1.5.0-aarch64.apk

      - name: Upload Signed APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.5.0-korean-fix rustdesk-1.5.0-aarch64.apk --clobber --repo dalsoop/rustdesk-korean
